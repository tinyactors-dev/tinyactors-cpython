id: buffers-are-ta-buffer
valid:
  - "static ta_status ta_python_encode(PyObject *value, ta_buffer *out) { return TA_OK; }"
  - "static PyObject *ta_python_decode(ta_bytes bytes) { return NULL; }"
  - "static void *ta_python_allocate(void *context, size_t size, size_t alignment) { return PyMem_RawMalloc(size); }"
  - "static void ta_python_release(void *context, void *pointer, size_t size) { PyMem_RawFree(pointer); }"
  - "static PyObject *ta_python_host_run(PyObject *self, PyTypeObject *cls, PyObject *const *args, size_t nargs, PyObject *kwnames) { return NULL; }"
  - "static size_t ta_python_count(PyObject *list, size_t limit) { return 0; }"
invalid:
  - "static PyObject *ta_python_decode(const uint8_t *bytes, size_t length) { return NULL; }"
  - "static ta_status ta_python_encode(PyObject *value, void *buffer, size_t capacity);"
  - "static const char *ta_python_text(PyObject *value, size_t *length) { return NULL; }"
  - "static ta_status ta_python_write(PyObject *value, char *out, uint32_t capacity) { return TA_OK; }"
  - "typedef struct ta_python_store { int (*put)(void *store, const void *blob, size_t length); } ta_python_store;"
